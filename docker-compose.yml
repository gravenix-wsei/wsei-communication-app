services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    image: node:22
    working_dir: /usr/src/app
    volumes:
      - ./wsei-communicator-server:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install --silent && npm run start"
    ports:
      - "3000:3000"
    env_file:
      - ./wsei-communicator-server/.env
    depends_on:
      - mongo

  client:
    image: node:22
    working_dir: /usr/src/app
    volumes:
      - ./wsei-communicator-client:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install --silent && npm run dev -- --host --port 5137"
    ports:
      - "5137:5137"
    depends_on:
      - server

volumes:
  mongo-data:
